[package]
name = "nl2sh"
version = "0.2.0"
edition = "2021"
description = "Natural Language to Shell for Android"
license = "MIT"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
libc = "0.2"
nix = { version = "0.29", features = ["fs", "process", "signal", "term", "user"] }
ratatui = "0.29"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shell-words = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "signal", "sync", "time", "io-util"] }
toml = "0.8"
url = "2"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "z"
