[package]
name = "nl2sh"
version = "1.0.1"
edition = "2021"
description = "Natural Language to Shell for Android"
license = "MIT"
repository = "https://github.com/nl2sh/nl2sh"
homepage = "https://github.com/nl2sh/nl2sh"
readme = "README.md"
keywords = ["android", "shell", "ai-agent", "tui", "termux"]
categories = ["command-line-utilities"]

[features]
default = ["self-update"]
self-update = []

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
libc = "0.2"
nix = { version = "0.29", features = ["fs", "process", "signal", "term", "user"] }
ratatui = "0.29"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "socks"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "0.26"
x509-parser = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shell-words = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "signal", "sync", "time", "io-util", "net"] }
toml = "0.8"
url = "2"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "z"
